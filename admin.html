  $("#list").innerHTML=list.length?`<div class="box"><table><tr><th>ПІБ</th><th>Група</th><th>Варіант</th><th>Почав</th><th>Завершив</th><th>Оцінка</th><th class="num">Бали</th><th class="num">%</th></tr>${list.map((x,i)=>`<tr class="${x.answers?"click":""}" data-i="${i}"><td>${esc(x.name)} ${isSk(x)?'<span class="pill">навички</span> ':""}${cnt[(x.name||"").toLowerCase().trim()+(isSk(x)?"#s":"")]>1?'<span class="pill bad">кілька спроб</span>':""}</td><td>${esc(x.group)}</td><td class="num">${x.variant||"—"}${/перездача/.test(x.blocks||"")||x.variant>30?' <span class="pill">перездача</span>':""}</td><td class="num">${esc((x.start||"").slice(11,16))}</td><td class="num">${x.done?esc(x.fin.slice(11,16)):'<span class="pill">виконує</span>'}</td><td class="g g${x.grade}">${x.done?x.grade:""}</td><td class="num">${x.done?esc(x.score)+" / "+esc(x.max):""}</td><td class="num">${x.done?esc(x.pct):""}</td></tr>`).join("")}</table></div><p class="muted">Натисніть рядок, щоб побачити відповіді студента.</p>`:'<p class="muted">Поки немає результатів з цього заняття.</p>';
}
$("#list").onclick=e=>{const tr=e.target.closest("tr.click");if(!tr)return;const x=window._list[+tr.dataset.i];showDetail(x)};
function ansText(it,a){if(a==null||a==="")return "—";
  if(it.type==="mc")return L[it.order.indexOf(a)]+") "+it.opts[a];
  if(it.type==="num")return a+" "+it.unit;
  if(it.type==="match")return it.m[1].map((l,k)=>l+" — "+(a[k]===""||a[k]==null?"—":it.m[2][+a[k]])).join("; ");
  if(it.type==="seq")return a.map(j=>it.s[1][j]).join(" → ");}
function rightText(it){if(it.type==="mc")return L[it.order.indexOf(it.correct)]+") "+it.opts[it.correct];
  if(it.type==="num")return fmt(it.answer)+" "+it.unit;
  if(it.type==="match")return it.m[1].map((l,k)=>l+" — "+it.m[2][it.m[3][k]]).join("; ");
  return it.s[1].join(" → ");}
function qText(it,n){const c=it.caseIdx!=null?"Задача "+CASES[it.caseIdx][0]+": ":"";return c+(it.q||(it.type==="match"?"Відповідність: "+it.m[0]:"Послідовність: "+it.s[0]))}
function items(n,v,answers){const its=buildFor(n,v);S={ans:answers||{}};let k=0;const ord=[];["A","B","C","D"].forEach(b=>its.filter(i=>i.block===b).forEach(i=>ord.push(i)));return ord}
function showDetail(x){const ord=items(x.lesson,x.variant,x.answers);
  $("#list").hidden=true;$("#detail").hidden=false;
  $("#detail").innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(x.name)} · ${esc(x.group)} · варіант ${x.variant}</h2><button class="btn" id="back">← До списку</button></div>
  <p>Оцінка <b class="g g${x.grade}">${x.grade}</b> · ${esc(x.score)} з ${esc(x.max)} балів · ${esc(x.pct)} % · ${esc(x.blocks||"")}</p>
  <div style="display:flex;flex-direction:column;gap:6px">${ord.map((it,i)=>{const sc=score(it);const c=sc>=it.pts?"ok":sc>0?"part":"no";return `<div class="it ${c}"><div class="h"><span>№ ${i+1}</span><span>${fmt(sc,2)} / ${it.pts}</span></div><div>${esc(qText(it))}</div><div class="a">Студент: <b>${esc(ansText(it,S.ans[it.id]))}</b></div>${c!=="ok"?`<div class="a">Правильно: <b>${esc(rightText(it))}</b></div>`:""}</div>`}).join("")}</div>`;
  $("#back").onclick=()=>{$("#detail").hidden=true;$("#list").hidden=false};window.scrollTo(0,0)}
let kv=1;
function drawKey(){const ord=items(cur,kv,{});
  $("#key").innerHTML=`<div class="row">Варіант <select id="kv">${Array.from({length:90},(_,i)=>`<option ${i+1===kv?"selected":""}>${i+1}</option>`).join("")}</select></div>
  <div class="box"><table><tr><th>№</th><th>Завдання</th><th>Правильна відповідь</th></tr>${ord.map((it,i)=>`<tr><td class="num">${i+1}</td><td>${esc(qText(it))}</td><td><b>${esc(rightText(it))}</b></td></tr>`).join("")}</table></div>`;
  $("#kv").onchange=e=>{kv=+e.target.value;drawKey()}}
try{if(sessionStorage.getItem("pw"))load()}catch(e){}
</script></body></html>
